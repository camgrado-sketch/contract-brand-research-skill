# Field schema only. This file is packaged with the Skill and is not a required runtime config.
# A private configuration may be supplied explicitly by the user or via SKILL_CONFIG_PATH.
# Do not copy secrets, client data, or proprietary research into a shared configuration.

self_brand:
  name: ""
  positioning: ""
  strategic_questions: []

benchmark_brands: []

research:
  default_geography: "global"
  official_top_up_page_limit: 5
  require_alignment_confirmation: true
  source_priority: ["A", "B", "C"]

knowledge_sync:
  enabled: false
  repository: ""
  # Mode: "general" or "obsidian-dbs"
  mode: "general"
  integration_branch: "main"
  review_branch_prefix: "note/"

  # Paths for Obsidian DBS Mode (relative to root)
  research_note_root: "01_Knowledge/Design-Business-Support/M1-Foundation/Product-Technical/Research-Notes"
  formal_card_root: "01_Knowledge/Design-Business-Support/M1-Foundation/Brand-Expression"
  index_root: "05_Indexes"

  # Metadata defaults for Obsidian DBS Mode
  dbs_metadata:
    domain: "design-business-support"
    module: "foundation"
    evidence_status: "to-validate"
    tag_review_status: "pending"
  card_mapping:
    positioning_card: ""
    expression_card: ""
    evidence_card: ""

review:
  require_user_mapping_confirmation: true
  require_pull_request: true
  pr_base_branch: "main"
